# Alertmanager configuration
# Alerts always go to alert-logger (http://localhost:9999).
# Optional Slack/Email: run  .\scripts\configure-alerts.ps1  after editing .env

global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance]

route:
  receiver: default-receiver
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-receiver
      continue: true
    - matchers:
        - team="application"
      receiver: app-team
    - matchers:
        - team="infrastructure"
      receiver: infra-team
    - matchers:
        - team="database"
      receiver: db-team

receivers:
  - name: default-receiver
    webhook_configs:
      - url: "http://alert-logger:9999/webhook"
        send_resolved: true

  - name: critical-receiver
    webhook_configs:
      - url: "http://alert-logger:9999/webhook"
        send_resolved: true

  - name: app-team
    webhook_configs:
      - url: "http://alert-logger:9999/webhook"
        send_resolved: true

  - name: infra-team
    webhook_configs:
      - url: "http://alert-logger:9999/webhook"
        send_resolved: true

  - name: db-team
    webhook_configs:
      - url: "http://alert-logger:9999/webhook"
        send_resolved: true
