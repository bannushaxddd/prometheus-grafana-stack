# Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "local-dev"
    env: "development"
    monitor: "prometheus-stack"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

rule_files:
  - /etc/prometheus/rules/alerting.yml
  - /etc/prometheus/rules/recording.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: "prometheus"
          component: "monitoring"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          component: "system"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"
          component: "containers"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"
          component: "proxy"

  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: "monitored-app"
          component: "application"
          app: "demo-api"

  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          service: "mysql"
          component: "database"

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: "mongodb"
          component: "database"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: "alertmanager"
          component: "monitoring"

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
          component: "monitoring"

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki"
          component: "logging"

  # File-based service discovery — drop JSON into file_sd/
  - job_name: "file-sd"
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_filepath]
        target_label: discovered_from
