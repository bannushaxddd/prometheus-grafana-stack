groups:
  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 80%) for more than 2 minutes."

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 95%)."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Only {{ $value | printf \"%.1f\" }}% disk space remaining."

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Instance {{ $labels.instance }} (job={{ $labels.job }}) is down"
          description: "Target has been unreachable for more than 1 minute."

  - name: application_alerts
    interval: 30s
    rules:
      - alert: HighHTTPErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
          team: application
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Error rate is {{ $value | printf \"%.2f\" }}% of requests (threshold: 5%)."

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 3m
        labels:
          severity: warning
          team: application
        annotations:
          summary: "High p95 request latency"
          description: "p95 latency is {{ $value | printf \"%.3f\" }}s (threshold: 1s)."

      - alert: ApplicationDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
          team: application
        annotations:
          summary: "Monitored application is down"
          description: "The demo application metrics endpoint is unreachable."

  - name: nginx_alerts
    interval: 30s
    rules:
      - alert: NginxHighConnections
        expr: nginx_connections_active > 100
        for: 2m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High active Nginx connections"
          description: "Active connections: {{ $value }} (threshold: 100)."

  - name: database_alerts
    interval: 30s
    rules:
      - alert: MySQLDown
        expr: mysql_up == 0 or up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
          team: database
        annotations:
          summary: "MySQL is down"
          description: "mysqld_exporter reports MySQL unreachable."

      - alert: MongoDBDown
        expr: mongodb_up == 0 or up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
          team: database
        annotations:
          summary: "MongoDB is down"
          description: "mongodb_exporter reports MongoDB unreachable."

      - alert: MySQLTooManyConnections
        expr: |
          mysql_global_status_threads_connected
          /
          clamp_min(mysql_global_variables_max_connections, 1)
          > 0.8
        for: 2m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "MySQL connection usage high"
          description: "Connection usage is {{ $value | printf \"%.0f\" | printf \"%s\" }} of max_connections (threshold 80%)."
