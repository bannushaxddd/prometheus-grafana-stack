# Render Blueprint — monitoring stack (free tier)
# Deploy: Render dashboard -> New + -> Blueprint -> select this repo.
# Services: app (metrics source), prometheus (scraper), grafana (dashboards),
#           alertmanager + alert-logger (alert pipeline).
# Local-only in the compose stack (not on Render): MySQL, MongoDB, exporters,
# Loki/promtail, nginx, caddy. Free tier has no persistent disk and services
# spin down after ~15 min idle, so metrics flow while dashboards are viewed.

services:
  - type: web
    name: monitoring-app
    runtime: docker
    rootDir: app
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: monitoring-prometheus
    runtime: docker
    rootDir: render/prometheus
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /-/healthy
    envVars:
      - key: APP_URL
        fromService:
          name: monitoring-app
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALERTMANAGER_URL
        fromService:
          name: monitoring-alertmanager
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GRAFANA_URL
        fromService:
          name: monitoring-grafana
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: monitoring-grafana
    runtime: docker
    rootDir: render/grafana
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PROMETHEUS_URL
        fromService:
          name: monitoring-prometheus
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: AdminMonitor2024
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"

  - type: web
    name: monitoring-alertmanager
    runtime: docker
    rootDir: render/alertmanager
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /-/healthy
    envVars:
      - key: ALERT_LOGGER_URL
        fromService:
          name: monitoring-alert-logger
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: monitoring-alert-logger
    runtime: docker
    rootDir: alert-logger
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
